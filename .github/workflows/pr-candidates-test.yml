name: Validate Strata PR candidates
on:
  push:
    branches:
      - verification/strata-pr-candidates-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tools.test_setup_calibrate_cli tools.test_strata_bench -v
